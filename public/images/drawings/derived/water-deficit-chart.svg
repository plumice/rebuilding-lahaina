<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .h1 { font-size: 12px; font-weight: 700; fill: #2a2a2a; letter-spacing: 0.4px; }
    .h2 { font-size: 10px; fill: #999; }
    .label { font-size: 10px; fill: #2a2a2a; font-weight: 500; }
    .num { font-size: 22px; fill: #2a2a2a; font-weight: 700; }
    .numunit { font-size: 10px; fill: #999; }
    .callout { font-size: 14px; font-weight: 700; fill: #c0392b; }
    .note { font-size: 10px; fill: #c0392b; }
    .src { font-size: 9px; fill: #bbb; }
  </style>

  <rect width="680" height="340" fill="#fff"/>

  <text x="32" y="30" class="h1">WATER SUPPLY vs. DEMAND</text>
  <text x="32" y="44" class="h2">Lahaina Aquifer Sector  /  Stage 2 Water Shortage (Sept 2025)</text>
  <line x1="32" y1="56" x2="648" y2="56" stroke="#eee" stroke-width="0.75"/>

  <!-- Supply bar -->
  <text x="32" y="84" class="label">Reliable supply capacity</text>
  <rect x="32" y="94" width="370" height="24" rx="12" fill="#27864a"/>
  <text x="414" y="113" class="num">4.26</text>
  <text x="462" y="113" class="numunit">MGD</text>

  <!-- Demand bar -->
  <text x="32" y="148" class="label">Current demand</text>
  <rect x="32" y="158" width="526" height="24" rx="12" fill="#c0392b"/>
  <text x="570" y="177" class="num">6.04</text>
  <text x="618" y="177" class="numunit">MGD</text>

  <!-- Deficit -->
  <line x1="404" y1="120" x2="404" y2="156" stroke="#c0392b" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.4"/>
  <rect x="404" y="196" width="154" height="36" rx="4" fill="#c0392b" opacity="0.05"/>
  <text x="481" y="213" text-anchor="middle" class="callout">41.8% DEFICIT</text>
  <text x="481" y="226" text-anchor="middle" class="note" style="font-weight:400;">1.78 MGD shortfall</text>

  <!-- Projected -->
  <line x1="32" y1="252" x2="648" y2="252" stroke="#eee" stroke-width="0.75"/>
  <text x="32" y="274" class="label" style="fill:#999;">With Kahana Well (projected 2026)</text>
  <rect x="32" y="282" width="440" height="18" rx="9" fill="#27864a" opacity="0.2"/>
  <text x="484" y="296" class="label">~5.09 MGD</text>
  <text x="560" y="296" class="note" style="font-weight:400;">still ~15.7% short</text>

  <text x="32" y="330" class="src">Sources: CWRM; WSP Highway Survey 2024; DWS Stage 2 declaration</text>
</svg>
